semantic_models:
  - name: orders
    model: ref('fct_orders')

    entities:
      - name: order
        type: primary
        expr: order_id

    dimensions:
      - name: is_drink_order
        type: categorical

    measures:
      - name: order_total
        agg: count_distinct
        expr: order_id
      - name: min_order_value
        agg: min
        expr: amount
      - name: order_cost
        agg: sum
        expr: amount

metrics:
  - name: "order_count"
    label: "order_count"
    description: the number of orders placed
    type: simple
    type_params:
      measure: order_toal
  - name: "order_gross_profit"
    description: "Gross profit from each order."
    type: derived
    label: "order_gross_profit"
    type_params:
      expr: revenue - cost
      metrics:
      - name: order_total
        alias: revenue
      - name: order_cost
        alias: cost